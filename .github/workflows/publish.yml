name: Publish plugin

# Publishes the Darkmoon plugin to the JetBrains Marketplace via CI.
# NOTE: the FIRST version of a new plugin must be uploaded MANUALLY once at
# https://plugins.jetbrains.com/plugin/add (attach build/distributions/*.zip).
# After that first manual upload, this workflow auto-publishes updates on a v* tag.
#
# Required repository secret:
#   PUBLISH_TOKEN — JetBrains Marketplace permanent token
#                   (https://plugins.jetbrains.com/author/me/tokens)
# Optional (plugin signing):
#   CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin --no-daemon
      - name: Attach plugin zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="$(ls build/distributions/*.zip | head -1)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$f" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$f" --title "$GITHUB_REF_NAME" --generate-notes
          fi
